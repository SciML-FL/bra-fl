# Dataset + Model related configurations
!!python/tuple [DATASET_NAME, DATASET_PATH, MODEL_CONFIGS/MODEL_NAME]: 
      - [CIFAR-10,  "work/data/cifar",                     RESNET-18-CUSTOM]

DATASET_DOWN: False
SPLIT_METHOD: DIRICHLET-BY-CLASS
DIRICHLET_ALPHA: 1.0

# Server configurations
CLIENTS_MANAGER: UPPERBOUND
NUM_TRAIN_ROUND: 250

MIN_NUM_CLIENTS: 100
TRAINING_SAMPLE_FRACTION: 0.20
MIN_TRAINING_SAMPLE_SIZE: 20
EVALUATE_SAMPLE_FRACTION: 0.01
MIN_EVALUATE_SAMPLE_SIZE: 1

# Attack Related configs
ATTACK_ROUND: 1
MAL_SHARED_DATA: False
MAL_CLIENT_FRAC: [0.00, 0.25, 0.40]
MAL_CLIENT_TYPE: [null, ALIE, LABELFLIP, SIGNFLIP, IPM]


# Each row supplies the BASE AGGR_STRAT_ARGS dict for that strategy; the swept
# parameter's value here is just a placeholder that post_processing overwrites.
!!python/tuple [SERVER_CONFIGS/SERVER_TYPE, SERVER_CONFIGS/AGGREGATE_STRAT, SERVER_CONFIGS/AGGR_STRAT_ARGS]:
      - [NORMAL, FED-AVERAGE,  {}]
      - [NORMAL, FED-BAYESIAN, {variation: v2}]

# Setup for Random Seeds
!!python/tuple [SERVER_CONFIGS/RANDOM_SEED, DATASET_CONFIGS/RANDOM_SEED]:
      - [0, 0]
      - [1, 1]
      - [2, 2]

# Unrelated Output Configurations
OUTPUT_CONFIGS/RESULT_LOG_PATH: "work/runs/c3/run_results/"